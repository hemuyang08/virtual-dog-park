<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Illustration of a Golden Retriever — simple original vector art -->

  <!-- Body -->
  <ellipse cx="100" cy="125" rx="58" ry="40" fill="#d4a04a"/>

  <!-- Fluffy chest -->
  <ellipse cx="100" cy="140" rx="35" ry="20" fill="#e8c068"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="34" fill="#d4a04a"/>

  <!-- Floppy ears -->
  <ellipse cx="72" cy="68" rx="12" ry="24" fill="#b8862e" transform="rotate(-10 72 68)"/>
  <ellipse cx="128" cy="68" rx="12" ry="24" fill="#b8862e" transform="rotate(10 128 68)"/>

  <!-- Muzzle -->
  <ellipse cx="100" cy="82" rx="18" ry="14" fill="#e8c068"/>

  <!-- Eyes -->
  <circle cx="90" cy="68" r="4" fill="#333"/>
  <circle cx="110" cy="68" r="4" fill="#333"/>

  <!-- Nose -->
  <ellipse cx="100" cy="80" rx="6" ry="4" fill="#333"/>

  <!-- Friendly smile -->
  <path d="M 88 90 Q 100 98 112 90" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Front legs -->
  <rect x="78" y="150" width="13" height="32" fill="#d4a04a" rx="4"/>
  <rect x="109" y="150" width="13" height="32" fill="#d4a04a" rx="4"/>

  <!-- Feet -->
  <ellipse cx="84" cy="182" rx="9" ry="5" fill="#b8862e"/>
  <ellipse cx="115" cy="182" rx="9" ry="5" fill="#b8862e"/>

  <!-- Fluffy tail -->
  <path d="M 155 110 Q 178 95 175 75" stroke="#d4a04a" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
