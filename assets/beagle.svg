<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Illustration of a Beagle — simple original vector art -->

  <!-- Body -->
  <ellipse cx="100" cy="130" rx="55" ry="38" fill="#f5e6d3"/>

  <!-- Brown patch on back -->
  <ellipse cx="85" cy="115" rx="30" ry="22" fill="#9b6b3f"/>

  <!-- Black patch on back -->
  <ellipse cx="120" cy="110" rx="18" ry="15" fill="#3a3a3a"/>

  <!-- Head -->
  <circle cx="100" cy="75" r="32" fill="#f5e6d3"/>

  <!-- Brown ear (left) -->
  <ellipse cx="75" cy="70" rx="12" ry="22" fill="#9b6b3f" transform="rotate(-15 75 70)"/>

  <!-- Brown ear (right) -->
  <ellipse cx="125" cy="70" rx="12" ry="22" fill="#9b6b3f" transform="rotate(15 125 70)"/>

  <!-- White muzzle area -->
  <ellipse cx="100" cy="85" rx="16" ry="14" fill="#ffffff"/>

  <!-- Eyes -->
  <circle cx="90" cy="72" r="4" fill="#333"/>
  <circle cx="110" cy="72" r="4" fill="#333"/>

  <!-- Nose -->
  <ellipse cx="100" cy="85" rx="6" ry="4" fill="#333"/>

  <!-- Mouth -->
  <path d="M 92 92 Q 100 98 108 92" stroke="#333" stroke-width="2" fill="none"/>

  <!-- Front legs -->
  <rect x="78" y="150" width="12" height="30" fill="#f5e6d3" rx="4"/>
  <rect x="110" y="150" width="12" height="30" fill="#f5e6d3" rx="4"/>

  <!-- Feet -->
  <ellipse cx="84" cy="180" rx="8" ry="5" fill="#9b6b3f"/>
  <ellipse cx="116" cy="180" rx="8" ry="5" fill="#9b6b3f"/>

  <!-- Tail -->
  <path d="M 150 120 Q 170 100 165 85" stroke="#9b6b3f" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
